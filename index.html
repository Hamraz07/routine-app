<style>

*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18202d,#07090d 55%);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1120px;margin:auto;padding:18px 15px 90px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brand{font-size:28px;font-weight:850}.muted{color:var(--muted)}button,input,textarea,select{font:inherit}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 13px;cursor:pointer}.btn:hover{filter:brightness(1.12)}.primary{background:var(--accent);color:#07101e;border:0;font-weight:800}.danger{color:#ff9aa4}.hero{margin-top:18px;padding:24px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#171e2a,#0d1118)}.eyebrow{text-transform:uppercase;letter-spacing:1.4px;font-size:10px;color:var(--muted);font-weight:800}.hero h1{font-size:34px;line-height:1.05;margin:7px 0}.hero p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#fff1;border:1px solid #ffffff12;border-radius:15px;padding:13px}.stat b{display:block;font-size:18px;margin-top:4px}.tabs{display:flex;gap:7px;overflow:auto;padding:4px 0 8px;margin-top:16px}.tab{white-space:nowrap}.tab.active{background:var(--accent);color:#07101e;font-weight:800}.todaymark{font-size:9px;margin-left:4px}.section{margin-top:20px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.section h2{font-size:18px;margin:0}.timeline{display:grid;gap:9px;margin-top:10px}.event{display:grid;grid-template-columns:92px 10px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;transition:.15s}.event[draggable="true"]{cursor:grab}.event.dragover{border-color:var(--accent);transform:scale(1.005)}.dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}.time{color:var(--muted);font-size:12px}.name{font-weight:750}.done{text-decoration:line-through;opacity:.5}.meta{font-size:12px;color:var(--muted);margin-top:4px}.check{width:22px;height:22px;accent-color:var(--accent)}.empty{padding:30px;border:1px dashed var(--line);border-radius:17px;text-align:center;color:var(--muted)}.ai{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:10px}.ai textarea{min-height:105px}.input,textarea,select{width:100%;background:#090c11;color:var(--text);border:1px solid var(--line);border-radius:13px;padding:12px;outline:none}.input:focus,textarea:focus,select:focus{border-color:var(--accent)}.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.show{display:flex}.dialog{width:min(800px,100%);max-height:90vh;overflow:auto;background:#10151d;border:1px solid var(--line);border-radius:22px;padding:20px}.form{display:grid;gap:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px;flex-wrap:wrap}.notice{padding:12px;border-radius:13px;background:#7c9cff12;border:1px solid #7c9cff30;color:#d0d8ff;font-size:13px;line-height:1.45;margin-top:10px}.notice.ok{background:#58d68d12;border-color:#58d68d30;color:#bff3d2}.notice.warn{background:#f3c96912;border-color:#f3c96930;color:#f7e5a9}.preview{display:grid;gap:7px;margin-top:12px;max-height:430px;overflow:auto}.preview .card{background:#fff1;border:1px solid #ffffff10;border-radius:12px;padding:10px}.previewday{font-size:12px;color:var(--muted);margin-top:12px}.loading{opacity:.65;pointer-events:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:10px}.daycard{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:10px;min-height:110px}.daycard.today{border-color:#7c9cff66}.daycard b{font-size:12px}.miniitem{font-size:11px;margin-top:8px;color:#dce2ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.miniitem span{display:block;color:var(--muted)}.footerline{margin-top:22px;font-size:12px;color:var(--muted);text-align:center}.switch{display:flex;align-items:center;gap:8px}.switch input{width:18px;height:18px}.pill{display:inline-flex;align-items:center;padding:4px 8px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--muted)}
@media(max-width:820px){.stats{grid-template-columns:1fr 1fr}.weekgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.ai{grid-template-columns:1fr}.row{grid-template-columns:1fr}.event{grid-template-columns:65px 8px 1fr auto}.hero h1{font-size:28px}.top{align-items:center}.top .actions .btn:first-child{display:none}}

<body><div class="app" id="app"></div>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="actions"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="modalAction">Continue</button></div></div></div>
<script>
const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const KEY="myRoutineZeroCostV1";
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{name:"Hamraz",activities:[]};
let activities=data.activities, selected=DAYS[(new Date().getDay()+6)%7], dragId=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':'&quot;',"'":"&#39;"}[c]));
const mins=t=>{const [h,m]=String(t).slice(0,5).split(":").map(Number);return h*60+m};
const fmt=t=>{let [h,m]=String(t).slice(0,5).split(":");h=+h;return `${h%12||12}:${m} ${h>=12?"PM":"AM"}`};
const duration=(s,e)=>{let d=mins(e)-mins(s);if(d<=0)d+=1440;return d};
const greeting=n=>{let h=new Date().getHours();return h<12?`Good morning, ${n} ☀️`:h<17?`Good afternoon, ${n} 👋`:h<21?`Good evening, ${n} 🌆`:`Good night, ${n} 🌙`};
const todayName=()=>DAYS[(new Date().getDay()+6)%7];
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random();
const save=()=>{data.activities=activities;localStorage.setItem(KEY,JSON.stringify(data));};
const toast=m=>alert(m);
function overlaps(a,b){if(a.day!==b.day)return false;const a1=mins(a.start),a2=mins(a.end)<=a1?mins(a.end)+1440:mins(a.end),b1=mins(b.start),b2=mins(b.end)<=b1?mins(b.end)+1440:mins(b.end);return a1<b2&&b1<a2;}
function validate(list){for(const a of list){if(!DAYS.includes(a.day)||!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(a.start)||!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(a.end))return `${a.name}: invalid time`;const d=duration(a.start,a.end);if(d>18*60 && !(a.is_fixed && d===1440))return `${a.name}: activity is longer than 18 hours`;if(d===1440 && !a.is_fixed)return `${a.name}: a 24-hour activity must be marked fixed`;}for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++)if(overlaps(list[i],list[j]))return `Conflict: ${list[i].name} overlaps ${list[j].name} on ${list[i].day}`;return null;}
function normalizeImportedTime(t){let v=String(t||'').trim();if(v==='24:00')return '00:00';return v;}
function normalizeName(s){return s.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim()}
function findActivity(words){const n=normalizeName(words);return activities.find(a=>normalizeName(a.name)===n)||activities.find(a=>normalizeName(a.name).includes(n)||n.includes(normalizeName(a.name)));}
function parseTime(s){let m=s.toLowerCase().match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);if(!m)return null;let h=+m[1],mi=+(m[2]||0);if(m[3]==='pm'&&h<12)h+=12;if(m[3]==='am'&&h===12)h=0;if(h>23||mi>59)return null;return `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`}
function parseRange(text){let m=text.match(/(\d{1,2}(?::\d{2})?\s*(?:am|pm)?)\s*(?:-|to|–|—)\s*(\d{1,2}(?::\d{2})?\s*(?:am|pm)?)/i);return m?[parseTime(m[1]),parseTime(m[2])]:null}
function dayFrom(text){for(const d of DAYS)if(new RegExp(`\\b${d}\\b`,'i').test(text))return d;const map={mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday',sun:'Sunday'};for(const k in map)if(new RegExp(`\\b${k}\\w*\\b`,'i').test(text))return map[k];return null}
function extractDuration(text, fallback=60){let m=text.match(/(\d+(?:\.\d+)?)\s*(hour|hours|hr|hrs|min|minutes)/i);if(!m)return fallback;let v=+m[1];return /min/i.test(m[2])?Math.round(v):Math.round(v*60)}
function addAct(name,day,start,end,type='Other',fixed=false){const x={id:uid(),name,day,start,end,type,is_fixed:fixed,completed:false};const bad=validate([...activities,x]);if(bad)throw Error(bad);activities.push(x);}
function rebuildSmart(text){const original=activities.map(x=>({...x}));let changed=[];let t=text.trim();let lower=t.toLowerCase();
 // remove/delete
 const rm=t.match(/(?:remove|delete|cancel)\s+(?:my\s+)?(.+?)(?:\s+(?:from|on)\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday))?(?:\.|$)/i);
 if(rm){let target=normalizeName(rm[1]),before=activities.length;activities=activities.filter(a=>!(normalizeName(a.name).includes(target)&&(!rm[2]||a.day.toLowerCase()===rm[2].toLowerCase())));if(activities.length===before)throw Error(`I couldn't find an activity matching “${rm[1].trim()}”.`);changed.push(`Removed ${before-activities.length} activity`);save();return changed.join('. ')+'.';}
 // move
 const mv=t.match(/(?:move|shift)\s+(?:my\s+)?(.+?)\s+(?:to|on)\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)(.*)/i);
 if(mv){let a=findActivity(mv[1]);if(!a)throw Error(`I couldn't find “${mv[1].trim()}” in your routine.`);let d=mv[2][0].toUpperCase()+mv[2].slice(1).toLowerCase(),r=parseRange(mv[3]);a.day=d;if(r){a.start=r[0];a.end=r[1]}else{let dur=duration(a.start,a.end),h=(d==='Saturday'||d==='Sunday')?10:18;a.start=`${String(h).padStart(2,'0')}:00`;a.end=`${String(Math.floor((h*60+dur)/60)%24).padStart(2,'0')}:${String((h*60+dur)%60).padStart(2,'0')}`;}let bad=validate(activities);if(bad){Object.assign(a,original.find(x=>x.id===a.id));throw Error(bad)}changed.push(`Moved ${a.name} to ${d}`);save();return changed.join('.')+'.';}
 // explicit activity with time range
 const addRe=/(?:add|schedule|include|put)\s+(?:a\s+)?(.+?)\s+(?:on\s+)?(monday|tuesday|wednesday|thursday|friday|saturday|sunday)(?:\s+at)?\s+([0-9]{1,2}(?::[0-9]{2})?\s*(?:am|pm)?\s*(?:-|to|–|—)\s*[0-9]{1,2}(?::[0-9]{2})?\s*(?:am|pm)?)/i;
 let ar=t.match(addRe);if(ar){let d=ar[2][0].toUpperCase()+ar[2].slice(1).toLowerCase(),r=parseRange(ar[3]);let type=/gym|workout|exercise/i.test(ar[1])?'Health':/study|dsa|java|exam/i.test(ar[1])?'Study':'Other';addAct(ar[1].trim(),d,r[0],r[1],type,false);save();return `Added ${ar[1].trim()} on ${d}, ${fmt(r[0])}–${fmt(r[1])}.`;}
 // fixed duty/work/college patterns
 const fixed=/\b(?:duty|shift|work|college|class|appointment|exam)\b/i.test(t);if(fixed){let d=dayFrom(t),r=parseRange(t);let name=(t.match(/(?:i have|my)\s+(.+?)(?:\s+(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b|\s+\d{1,2}(?::\d{2})?\s*(?:am|pm)?)/i)||[])[1]||(/college/i.test(t)?'College':/duty|shift/i.test(t)?'Duty':'Fixed commitment');if(d&&r){addAct(name.trim(),d,r[0],r[1],'Work',true);save();return `Added fixed ${name.trim()} on ${d}, ${fmt(r[0])}–${fmt(r[1])}.`;}}
 // sleep
 if(/\b(sleep|sleeping)\b/i.test(t)){let h=(t.match(/(\d+(?:\.\d+)?)\s*(?:hours|hrs|hour)/i)||[])[1];let hours=h?Math.max(1,Math.min(12,+h)):8;let days=lower.includes('every day')?DAYS:[dayFrom(t)||selected];for(const d of days){let start=lower.includes('night')?'22:00':'23:00',sm=mins(start),em=(sm+Math.round(hours*60))%1440,end=`${String(Math.floor(em/60)).padStart(2,'0')}:${String(em%60).padStart(2,'0')}`;try{addAct(`Sleep (${hours}h)`,d,start,end,'Sleep',false)}catch(e){/* keep existing conflict */}}save();return `Added ${hours} hours of sleep to ${days.join(', ')} where it fit.`;}
 // generic goals: add gym/study/meal if requested
 const goals=[];if(/\bgym|workout|exercise\b/i.test(t))goals.push(['Gym','Health',60]);if(/\bdsa\b|\bstudy\b|\bjava\b/i.test(t))goals.push(['Study','Study',extractDuration(t,120)]);if(/\bmeal|lunch|dinner|breakfast\b/i.test(t))goals.push(['Meal','Meal',45]);
 if(goals.length){let days=lower.includes('every day')?DAYS:[dayFrom(t)||selected];for(const [name,type,dur] of goals){let done=0;for(const d of days){let slots=d==='Saturday'||d==='Sunday'?[9,11,14,16,18,20]:[6,7,17,18,19,20,21];for(const hh of slots){let st=`${String(hh).padStart(2,'0')}:00`,em=(hh*60+dur)%1440,en=`${String(Math.floor(em/60)).padStart(2,'0')}:${String(em%60).padStart(2,'0')}`,candidate={id:uid(),name,day:d,start:st,end:en,type,is_fixed:false,completed:false};if(!activities.some(a=>overlaps(a,candidate))){activities.push(candidate);done++;break}}}}save();return `Added ${goals.map(x=>x[0]).join(' and ')} into available time slots (${done} placement${done===1?'':'s'}).`;}
 if(/build|plan|organize|rebuild/i.test(lower)){return generateBaseline(t)}
 return `I can make this change without an AI service, but I don't yet have a local rule for that exact request. Try commands like “move gym to Wednesday 6 PM”, “remove Friday study”, “add DSA Tuesday 7 PM–9 PM”, or “I have duty Tuesday 8 PM–8 AM”.`;}
function generateBaseline(text){const before=activities.length;let fixed=activities.filter(a=>a.is_fixed);if(/college/i.test(text)&&!fixed.some(a=>/college/i.test(a.name))){for(const d of DAYS.slice(0,5))try{addAct('College',d,'08:00','16:00','Work',true)}catch{} }
for(const d of DAYS.slice(0,5)){if(!activities.some(a=>a.day===d&&/sleep/i.test(a.name)))try{addAct('Sleep',d,'23:00','07:00','Sleep',false)}catch{}if(!activities.some(a=>a.day===d&&/dsa|study/i.test(a.name)))try{addAct('Study / DSA',d,'18:00','20:00','Study',false)}catch{}if(!activities.some(a=>a.day===d&&/gym/i.test(a.name))&&['Monday','Wednesday','Friday'].includes(d))try{addAct('Gym',d,'17:00','18:00','Health',false)}catch{}}
save();return `Built a starter week around your fixed commitments and added sleep, study, and gym where space was available. ${activities.length-before} activities added.`;}
function render(){const arr=activities.filter(x=>x.day===selected).sort((a,b)=>mins(a.start)-mins(b.start));const total=arr.length,done=arr.filter(x=>x.completed).length;let now=new Date(),nm=now.getHours()*60+now.getMinutes(),cur=arr.find(x=>{let s=mins(x.start),e=mins(x.end);return e<=s?(nm>=s||nm<e):nm>=s&&nm<e}),next=arr.find(x=>mins(x.start)>nm);app.innerHTML=`<div class="top"><div><div class="brand">My Routine</div><div class="muted">${esc(greeting(data.name))}</div><div class="muted">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</div></div><div class="actions" style="margin:0"><button class="btn" id="profile">Profile</button><button class="btn" id="reset">Reset</button></div></div><div class="tabs">${DAYS.map(d=>`<button class="btn tab ${d===selected?'active':''}" data-day="${d}">${d}${d===todayName()?'<span class="todaymark">TODAY</span>':''}</button>`).join('')}</div><section class="hero"><div class="eyebrow">Right now</div><h1>${esc(cur?.name||'Free time')}</h1><p>${cur?`${fmt(cur.start)}–${fmt(cur.end)} · ${esc(cur.type)}`:'Nothing scheduled right now.'}</p><div class="stats"><div class="stat"><span class="muted">Next</span><b>${esc(next?.name||'—')}</b></div><div class="stat"><span class="muted">Activities</span><b>${total}</b></div><div class="stat"><span class="muted">Completed</span><b>${done}/${total}</b></div><div class="stat"><span class="muted">Mode</span><b>Free test</b></div></div></section><section class="section"><div class="sectionhead"><h2>${selected} · Full day</h2><button class="btn primary" id="add">＋ Activity</button></div><div class="timeline">${arr.length?arr.map(x=>`<div class="event" draggable="${!x.is_fixed}" data-id="${x.id}"><div class="time">${fmt(x.start)}<br>${fmt(x.end)}</div><div class="dot"></div><div><div class="name ${x.completed?'done':''}">${esc(x.name)} ${x.is_fixed?'<span class="pill">Fixed</span>':''}</div><div class="meta">${esc(x.type)}</div></div><div><input class="check" type="checkbox" data-id="${x.id}" ${x.completed?'checked':''}><button class="btn edit" data-id="${x.id}">Edit</button></div></div>`).join(''):`<div class="empty">No activities yet. Add one or tell My Routine what you need.</div>`}</div></section><section class="section"><h2>Build a custom routine</h2><div class="toolbar" style="margin-top:10px"><button class="btn primary" id="chatgpt">✨ Create with ChatGPT</button><button class="btn" id="importChat">📥 Import ChatGPT routine</button></div><div class="hint">Use ChatGPT for the free natural-language planning step, then paste its structured routine back here. No API key, subscription, or payment is required from My Routine.</div></section><section class="section"><h2>Quick local changes</h2><div class="ai"><textarea id="command" class="input" placeholder="Try: “Move gym to Wednesday 6 PM–7 PM” or “I have night duty Tuesday 8 PM–8 AM.”"></textarea><button class="btn primary" id="ask">✨ Plan it</button></div><div class="hint">These quick commands are handled locally in your browser.</div></section><section class="section"><h2>Week overview</h2><div class="weekgrid">${DAYS.map(d=>`<div class="daycard ${d===todayName()?'today':''}"><b>${d}</b>${activities.filter(x=>x.day===d).sort((a,b)=>mins(a.start)-mins(b.start)).slice(0,5).map(x=>`<div class="miniitem">${fmt(x.start)} · ${esc(x.name)}</div>`).join('')||'<div class="miniitem">Empty</div>'}</div>`).join('')}</div></section><div class="footerline">Zero-cost local test · No OpenAI · No Supabase · No payment plan</div>`;
 document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=b.dataset.day;render()});add.onclick=()=>activityModal();profile.onclick=profileModal;reset.onclick=()=>{if(confirm('Reset this local routine?')){activities=[];save();render()}};ask.onclick=()=>aiCommand(command.value);chatgpt.onclick=chatGPTModal;importChat.onclick=importChatGPTModal;document.querySelectorAll('.check').forEach(c=>c.onchange=()=>{let x=activities.find(a=>a.id===c.dataset.id);x.completed=c.checked;save();render()});document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>activityModal(activities.find(a=>a.id===b.dataset.id)));document.querySelectorAll('.event').forEach(el=>{el.ondragstart=()=>dragId=el.dataset.id;el.ondragover=e=>{e.preventDefault();el.classList.add('dragover')};el.ondragleave=()=>el.classList.remove('dragover');el.ondrop=e=>{e.preventDefault();el.classList.remove('dragover');swap(dragId,el.dataset.id)}})}

function chatGPTPrompt(){
 return `You are the My Routine planning assistant. Create a realistic, conflict-free weekly routine for the user. Ask follow-up questions if important information is missing. Respect fixed commitments, sleep/recovery, meals, travel time, preferences, recurring activities, and the user's priorities. Do not invent fixed commitments. You may rearrange flexible activities to make the week fit.

When you are finished, output ONLY valid JSON inside a single json code block using exactly this shape:
{
  "name": "${String(data.name).replace(/"/g,'\\"')}",
  "activities": [
    {"name":"College","day":"Monday","start":"08:00","end":"16:00","type":"Work","is_fixed":true},
    {"name":"Gym","day":"Monday","start":"17:00","end":"18:00","type":"Health","is_fixed":false}
  ]
}

Rules: day must be Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, or Sunday. Time must be 24-hour HH:MM. Each activity must have a meaningful name and type. Keep the number of activities reasonable. Do not overlap activities. Overnight activities are allowed (for example 20:00 to 08:00).

The user may have an existing routine below. Preserve useful existing activities unless the user asks to change them. Never use 24:00; use 00:00 for midnight. Do not create any activity longer than 18 hours unless it is a genuinely fixed all-day commitment from the user. Avoid all-day commitments unless the user explicitly says something occupies the entire day.
Existing routine:
${JSON.stringify(activities,null,2)}

Now ask the user for their routine requirements and then produce the final JSON only after you have enough information.`;
}
function chatGPTModal(){
 const prompt=chatGPTPrompt();
 openModal('Create your routine with ChatGPT',`<div class="notice">This is the <b>free test method</b>. ChatGPT does the natural-language planning; My Routine then imports and validates the result. You do not need an OpenAI API key.</div><p class="hint">1. Copy the prompt below. 2. Open ChatGPT. 3. Paste the prompt and describe your life, commitments and goals. 4. Copy the final JSON it gives you. 5. Return here and choose “Import ChatGPT routine”.</p><textarea id="chatPrompt" class="input" style="min-height:300px">${esc(prompt)}</textarea><div class="actions" style="justify-content:flex-start"><button class="btn primary" id="copyPrompt">Copy prompt</button><button class="btn" id="openChat">Open ChatGPT</button></div>`,()=>{modal.classList.remove('show')},'Close');
 setTimeout(()=>{copyPrompt.onclick=async()=>{try{await navigator.clipboard.writeText(prompt);toast('Prompt copied. Open ChatGPT and paste it.')}catch{chatPrompt.select();document.execCommand('copy');toast('Prompt copied.')}};openChat.onclick=()=>window.open('https://chatgpt.com/','_blank','noopener,noreferrer')},0);
}
function extractRoutineJSON(raw){
 let t=String(raw||'').trim();
 const fence=t.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
 if(fence)t=fence[1].trim();
 const start=t.indexOf('{'),end=t.lastIndexOf('}');
 if(start>=0&&end>start)t=t.slice(start,end+1);
 return JSON.parse(t);
}
function repairImported(list){
 const out=list.map(x=>({...x}));
 const locked=a=>a.is_fixed||/^sleep/i.test(a.type)||/^sleep/i.test(a.name);
 const score=a=>locked(a)?1000:(/^study|exam/i.test(a.type)?50:/^health/i.test(a.type)?40:20);
 const conflicts=(arr)=>{for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++)if(overlaps(arr[i],arr[j]))return [i,j];return null};
 const changes=[];
 for(let pass=0;pass<out.length*3;pass++){
   const pair=conflicts(out); if(!pair)break;
   let [i,j]=pair, a=out[i], b=out[j];
   let mover,other;
   if(locked(a)&&!locked(b)){mover=b;other=a}
   else if(locked(b)&&!locked(a)){mover=a;other=b}
   else if(score(a)<=score(b)){mover=a;other=b}
   else {mover=b;other=a}
   const dur=duration(mover.start,mover.end), day=mover.day;
   let placed=false;
   const candidates=[];
   for(let start=0;start<=1440-dur;start+=30){
     const end=start+dur;
     const st=`${String(Math.floor(start/60)).padStart(2,'0')}:${String(start%60).padStart(2,'0')}`;
     const en=end===1440?'00:00':`${String(Math.floor(end/60)).padStart(2,'0')}:${String(end%60).padStart(2,'0')}`;
     // Prefer times close to the original start.
     candidates.push({start:st,end:en,diff:Math.abs(start-mins(mover.start))});
   }
   candidates.sort((x,y)=>x.diff-y.diff);
   for(const c of candidates){
     const test={...mover,start:c.start,end:c.end};
     if(!out.some(x=>x!==mover&&overlaps(x,test))){mover.start=c.start;mover.end=c.end;changes.push(`${mover.name} moved to ${fmt(c.start)}–${fmt(c.end)} on ${day}`);placed=true;break}
   }
   if(!placed){
     // If the day is full, try another day for flexible activities.
     const dayOrder=[...DAYS].sort((x,y)=>x===day?-1:y===day?1:0);
     for(const d of dayOrder){
       if(d===day)continue;
       for(let start=0;start<=1440-dur;start+=30){
         const end=start+dur,st=`${String(Math.floor(start/60)).padStart(2,'0')}:${String(start%60).padStart(2,'0')}`,en=end===1440?'00:00':`${String(Math.floor(end/60)).padStart(2,'0')}:${String(end%60).padStart(2,'0')}`;
         const test={...mover,day:d,start:st,end:en};
         if(!out.some(x=>x!==mover&&overlaps(x,test))){mover.day=d;mover.start=st;mover.end=en;changes.push(`${mover.name} moved to ${d} ${fmt(st)}–${fmt(en)}`);placed=true;break}
       }
       if(placed)break;
     }
   }
   if(!placed)throw Error(`Could not automatically resolve the conflict involving ${mover.name}.`);
 }
 const bad=validate(out); if(bad)throw Error(bad);
 return {list:out,changes};
}
function importChatGPTModal(){
 openModal('Import routine from ChatGPT',`<div class="notice">Paste the <b>final JSON</b> from ChatGPT below. My Routine will validate every activity before saving it.</div><textarea id="importBox" class="input" style="min-height:300px" placeholder="Paste ChatGPT's JSON here..."></textarea>`,()=>{
   try{
    const obj=extractRoutineJSON(importBox.value);
    const incoming=Array.isArray(obj.activities)?obj.activities:[];
    if(!incoming.length)throw Error('No activities were found in the JSON.');
    const clean=incoming.map(a=>({id:uid(),name:String(a.name||'').trim(),day:String(a.day||''),start:normalizeImportedTime(a.start),end:normalizeImportedTime(a.end),type:String(a.type||'Other'),is_fixed:Boolean(a.is_fixed),completed:false}));
    if(clean.some(a=>!a.name))throw Error('Every activity needs a name.');
    // Validate and, when possible, automatically repair conflicts by moving
    // flexible activities. Fixed commitments and sleep are protected.
    let repaired=repairImported(clean);
    const fixed=repaired.list.filter(a=>a.is_fixed).length;
    const repairNote=repaired.changes.length?`<div class="notice warn"><b>Automatic repair:</b> ${repaired.changes.map(esc).join('<br>')}</div>`:'';
    const finalList=repaired.list;
    openModal('Routine ready to import',`<div class="notice ok"><b>${finalList.length} activities</b> passed validation, including ${fixed} fixed commitment${fixed===1?'':'s'}.</div>${repairNote}<div class="preview">${DAYS.map(d=>{const xs=finalList.filter(a=>a.day===d).sort((a,b)=>mins(a.start)-mins(b.start));return xs.length?`<div class="card"><b>${d}</b>${xs.map(x=>`<div class="meta">${fmt(x.start)}–${fmt(x.end)} · ${esc(x.name)}${x.is_fixed?' · Fixed':''}</div>`).join('')}</div>`:''}).join('')}</div><div class="notice warn">Importing will <b>replace the current local routine</b>. Your current routine is not uploaded anywhere.</div>`,()=>{activities=finalList;data.name=String(obj.name||data.name||'').trim()||data.name;save();selected=todayName();modal.classList.remove('show');render();toast('Routine imported successfully.')},'Import routine');
   }catch(e){toast('Could not import: '+e.message)}
 },'Validate');
}

function activityModal(existing){let x=existing||{name:'',day:selected,start:'09:00',end:'10:00',type:'Other',is_fixed:false,completed:false};openModal(existing?'Edit activity':'Add activity',`<div class="form"><label>Name<input class="input" id="n" value="${esc(x.name)}"></label><div class="row"><label>Day<select id="d" class="input">${DAYS.map(v=>`<option ${v===x.day?'selected':''}>${v}</option>`).join('')}</select></label><label>Type<select id="t" class="input">${['Work','Study','Health','Meal','Personal','Sleep','Other'].map(v=>`<option ${v===x.type?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="row"><label>Start<input class="input" id="s" type="time" value="${x.start}"></label><label>End<input class="input" id="e" type="time" value="${x.end}"></label></div><label class="switch"><input id="f" type="checkbox" ${x.is_fixed?'checked':''}> Fixed commitment</label></div>`,()=>{if(!n.value.trim()||s.value===e.value)return toast('Enter a name and different start/end times.');let row={...x,name:n.value.trim(),day:d.value,type:t.value,start:s.value,end:e.value,is_fixed:f.checked};let others=activities.filter(a=>a.id!==x.id);let bad=validate([...others,row]);if(bad)return toast(bad);if(existing)activities=activities.map(a=>a.id===x.id?row:a);else activities.push({...row,id:uid()});save();selected=row.day;modal.classList.remove('show');render()},existing?'Save':'Add');if(existing){modalAction.insertAdjacentHTML('afterend',`<button class="btn danger" id="del">Delete</button>`);del.onclick=()=>{if(confirm('Delete this activity?')){activities=activities.filter(a=>a.id!==existing.id);save();modal.classList.remove('show');render()}}}}
function swap(aid,bid){if(!aid||aid===bid)return;let a=activities.find(x=>x.id===aid),b=activities.find(x=>x.id===bid);if(!a||!b||a.is_fixed||b.is_fixed)return toast('Fixed activities cannot be moved by drag-and-drop.');let A={day:a.day,start:a.start,end:a.end},B={day:b.day,start:b.start,end:b.end};Object.assign(a,B);Object.assign(b,A);let bad=validate(activities);if(bad){Object.assign(a,A);Object.assign(b,B);return toast(bad)}save();render()}
